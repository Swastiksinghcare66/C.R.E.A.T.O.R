                    { id: "convert-types", name: "Type Conversion" },
                    { id: "rename", name: "Rename Columns" },
                    { id: "filter-rows", name: "Filter Rows" }
                ]
            }
        };

        function DataPreprocessingToolkit() {
            const [data, setData] = useState(null);
            const [originalData, setOriginalData] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedTool, setSelectedTool] = useState(null);
            const [expandedCategories, setExpandedCategories] = useState({});
            const [processing, setProcessing] = useState(false);
            const [aiChatOpen, setAiChatOpen] = useState(false);
            const fileInputRef = useRef(null);

            const handleFileUpload = (file) => {
                if (file) {
                    Papa.parse(file, {
                        header: true,
                        dynamicTyping: true,
                        complete: (results) => {
                            setData(results.data);
                            setOriginalData(JSON.parse(JSON.stringify(results.data)));
                            setSelectedTool(null);
                        },
                        error: (error) => {
                            alert("Error parsing file: " + error.message);
                        }
                    });
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const file = e.dataTransfer.files[0];
                if (file) handleFileUpload(file);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
            };

            const toggleCategory = (categoryKey) => {
                setExpandedCategories(prev => ({
                    ...prev,
                    [categoryKey]: !prev[categoryKey]
                }));
            };

            const selectTool = (categoryKey, toolId) => {
                setSelectedCategory(categoryKey);
                setSelectedTool(toolId);
            };

            const downloadData = () => {
                if (!data) return;
                const csv = Papa.unparse(data);
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'processed_data.csv';
                a.click();
                URL.revokeObjectURL(url);
            };

            const loadSampleData = () => {
                const sampleData = [
                    { age: 25, salary: 50000, department: 'Sales', experience: 2, rating: 4.2 },
                    { age: 30, salary: 65000, department: 'IT', experience: 5, rating: 4.5 },
                    { age: null, salary: 55000, department: 'HR', experience: 3, rating: null },
                    { age: 28, salary: null, department: 'Sales', experience: 4, rating: 3.8 },
                    { age: 35, salary: 80000, department: 'IT', experience: 8, rating: 4.7 },
                    { age: 22, salary: 45000, department: 'Marketing', experience: 1, rating: 3.9 },
                    { age: 40, salary: 95000, department: 'IT', experience: 12, rating: 4.8 },
                    { age: 27, salary: 58000, department: 'HR', experience: null, rating: 4.1 },
                    { age: 32, salary: 72000, department: 'Sales', experience: 6, rating: 4.4 },
                    { age: 29, salary: 62000, department: 'Marketing', experience: 4, rating: null }
                ];
                setData(sampleData);
                setOriginalData(JSON.parse(JSON.stringify(sampleData)));
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <h1>C.R.E.A.T.O.R</h1>
                        <p>Cognitive Runtime for Engineering Agent-based Technology Operations & Results</p>
                    </header>

                    {!data ? (
                        <div 
                            className="upload-section"
                            onDrop={handleDrop}
                            onDragOver={handleDragOver}
                            onClick={() => fileInputRef.current?.click()}
                        >
                            <div className="upload-icon">📁</div>
                            <h3>Upload Your Dataset</h3>
                            <p style={{color: 'var(--text-secondary)', marginTop: '0.5rem'}}>
                                Drag & drop a CSV file or click to browse
                            </p>
                            <p style={{color: 'var(--text-secondary)', fontSize: '0.9rem', marginTop: '1rem'}}>
                                Supports CSV files of any size
                            </p>
                            <input 
                                ref={fileInputRef}
                                type="file" 
                                className="file-input" 
                                accept=".csv"
                                onChange={(e) => handleFileUpload(e.target.files[0])}
                            />
                            <div style={{marginTop: '1.5rem'}}>
                                <button className="btn btn-secondary" onClick={(e) => {
                                    e.stopPropagation();
                                    loadSampleData();
                                }}>
                                    Load Sample Dataset
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="main-content">
                            <aside className="sidebar">
                                <h3>Preprocessing Tools</h3>
                                {Object.entries(toolsConfig).map(([key, category]) => (
                                    <div key={key} className="tool-category">
                                        <div 
                                            className={`category-header ${selectedCategory === key ? 'active' : ''}`}
                                            onClick={() => toggleCategory(key)}
                                        >
                                            <span>{category.icon} {category.name}</span>
                                            <span className={`expand-icon ${expandedCategories[key] ? 'expanded' : ''}`}>
                                                ▶
                                            </span>
                                        </div>
                                        <div className={`tool-list ${expandedCategories[key] ? 'expanded' : ''}`}>
                                            {category.tools.map(tool => (
                                                <div 
                                                    key={tool.id}
                                                    className={`tool-item ${selectedTool === tool.id ? 'active' : ''}`}
                                                    onClick={() => selectTool(key, tool.id)}
                                                >
                                                    {tool.name}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </aside>

                            <main className="workspace">
                                <DatasetInfo data={data} />
                                {selectedTool ? (
                                    <ToolWorkspace 
                                        tool={selectedTool} 
                                        category={selectedCategory}
                                        data={data} 
                                        setData={setData}
                                        originalData={originalData}
                                    />
                                ) : (
                                    <div className="empty-state">
                                        <div className="empty-state-icon">🎯</div>
                                        <h3>Select a Tool to Get Started</h3>
                                        <p>Choose a preprocessing technique from the sidebar</p>
                                    </div>
                                )}
                                <div className="action-buttons">
                                    <button className="btn" onClick={downloadData}>
                                        💾 Download Processed Data
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => {
                                        setData(null);
                                        setSelectedTool(null);
                                    }}>
                                        🔄 Load New Dataset
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => {
                                        setData(JSON.parse(JSON.stringify(originalData)));
                                    }}>
                                        ↩️ Reset to Original
                                    </button>
                                </div>
                            </main>
                        </div>
                    )}

                    {data && (
                        <>
                            <button 
                                className={`ai-agent-button ${aiChatOpen ? 'active' : ''}`}
                                onClick={() => setAiChatOpen(!aiChatOpen)}
                                title="AI Preprocessing Assistant"
                            >
                                🤖
                            </button>
                            <AIAgent 
                                isOpen={aiChatOpen} 
                                onClose={() => setAiChatOpen(false)}
                                data={data}
                                onApplyTool={(category, tool) => {
                                    selectTool(category, tool);
                                    setAiChatOpen(false);
                                }}
                            />
                        </>
                    )}
                </div>
            );
        }

        function DatasetInfo({ data }) {
            if (!data || data.length === 0) return null;

            const columns = Object.keys(data[0] || {});
            const rows = data.length;
            
            const missingCount = data.reduce((acc, row) => {
                Object.values(row).forEach(val => {
                    if (val === null || val === undefined || val === '') acc++;
                });
                return acc;
            }, 0);

            const numericCols = columns.filter(col => {
                return data.some(row => typeof row[col] === 'number');
            });

            return (
                <div className="dataset-info">
                    <div className="info-item">
                        <div className="info-label">Rows</div>
                        <div className="info-value">{rows.toLocaleString()}</div>
                    </div>
                    <div className="info-item">
                        <div className="info-label">Columns</div>
                        <div className="info-value">{columns.length}</div>
                    </div>
                    <div className="info-item">
                        <div className="info-label">Missing Values</div>
                        <div className="info-value">{missingCount}</div>
                    </div>
                    <div className="info-item">
                        <div className="info-label">Numeric Columns</div>
                        <div className="info-value">{numericCols.length}</div>
                    </div>
                </div>
            );
        }

        function ToolWorkspace({ tool, category, data, setData, originalData }) {
            const [config, setConfig] = useState({});
            const [result, setResult] = useState(null);

            const getColumns = () => Object.keys(data[0] || {});
            
            const getNumericColumns = () => {
                return getColumns().filter(col => 
                    data.some(row => typeof row[col] === 'number')
                );
            };

            const getCategoricalColumns = () => {
                return getColumns().filter(col => 
                    data.some(row => typeof row[col] === 'string')
                );
            };

            const applyTool = () => {
                let newData = JSON.parse(JSON.stringify(data));
                let message = "";

                switch(tool) {
                    case 'overview':
                        return renderOverview();
                    case 'statistics':
                        return renderStatistics();
                    case 'missing':
                        return renderMissingAnalysis();
                    case 'correlation':
                        return renderCorrelation();
                    case 'distribution':
                        return renderDistribution();
                    case 'outliers':
                        return renderOutliers();
                    
                    // Imputation
                    case 'mean':
                    case 'median':
                    case 'mode':
                        newData = applySimpleImputation(newData, config.column, tool);
                        message = `Applied ${tool} imputation to ${config.column}`;
                        break;
                    
                    case 'constant':
                        newData = applyConstantImputation(newData, config.column, config.value || 0);
                        message = `Applied constant imputation (${config.value}) to ${config.column}`;
                        break;

                    case 'ffill':
                    case 'bfill':
                        newData = applyFillImputation(newData, config.column, tool);
                        message = `Applied ${tool === 'ffill' ? 'forward' : 'backward'} fill to ${config.column}`;
                        break;

                    // Encoding
                    case 'label':
                        newData = applyLabelEncoding(newData, config.column);
                        message = `Applied label encoding to ${config.column}`;
                        break;

                    case 'onehot':
                        newData = applyOneHotEncoding(newData, config.column);
                        message = `Applied one-hot encoding to ${config.column}`;
                        break;

                    // Scaling
                    case 'standard':
                    case 'minmax':
                    case 'robust':
                        newData = applyScaling(newData, config.columns || [], tool);
                        message = `Applied ${tool} scaling to selected columns`;
                        break;

                    // Transformation
                    case 'log':
                    case 'sqrt':
                        newData = applyTransformation(newData, config.columns || [], tool);
                        message = `Applied ${tool} transformation to selected columns`;
                        break;

                    // Cleaning
                    case 'duplicates':
                        newData = removeDuplicates(newData);
                        message = `Removed ${data.length - newData.length} duplicate rows`;
                        break;

                    default:
                        message = `${tool} configuration interface`;
                }

                if (newData !== data) {
                    setData(newData);
                    setResult({ type: 'success', message });
                }
            };

            // Implementation functions
            const applySimpleImputation = (data, column, method) => {
                const values = data.map(row => row[column]).filter(v => v !== null && v !== undefined && v !== '');
                let fillValue;

                if (method === 'mean') {
                    fillValue = values.reduce((a, b) => a + b, 0) / values.length;
                } else if (method === 'median') {
                    const sorted = [...values].sort((a, b) => a - b);
                    fillValue = sorted[Math.floor(sorted.length / 2)];
                } else if (method === 'mode') {
                    const freq = {};
                    values.forEach(v => freq[v] = (freq[v] || 0) + 1);
                    fillValue = Object.keys(freq).reduce((a, b) => freq[a] > freq[b] ? a : b);
                }

                return data.map(row => ({
                    ...row,
                    [column]: row[column] ?? fillValue
                }));
            };

            const applyConstantImputation = (data, column, value) => {
                return data.map(row => ({
                    ...row,
                    [column]: row[column] ?? value
                }));
            };

            const applyFillImputation = (data, column, method) => {
                let lastValue = null;
                const newData = [...data];
                
                if (method === 'ffill') {
                    for (let i = 0; i < newData.length; i++) {
                        if (newData[i][column] !== null && newData[i][column] !== undefined) {
                            lastValue = newData[i][column];
                        } else if (lastValue !== null) {
                            newData[i][column] = lastValue;
                        }
                    }
                } else {
                    for (let i = newData.length - 1; i >= 0; i--) {
                        if (newData[i][column] !== null && newData[i][column] !== undefined) {
                            lastValue = newData[i][column];
                        } else if (lastValue !== null) {
                            newData[i][column] = lastValue;
                        }
                    }
                }
                
                return newData;
            };

            const applyLabelEncoding = (data, column) => {
                const uniqueValues = [...new Set(data.map(row => row[column]))];
                const mapping = {};
                uniqueValues.forEach((val, idx) => mapping[val] = idx);
                
                return data.map(row => ({
                    ...row,
                    [column + '_encoded']: mapping[row[column]]
                }));
            };

            const applyOneHotEncoding = (data, column) => {
                const uniqueValues = [...new Set(data.map(row => row[column]))];
                
                return data.map(row => {
                    const newRow = { ...row };
                    uniqueValues.forEach(val => {
                        newRow[`${column}_${val}`] = row[column] === val ? 1 : 0;
                    });
                    return newRow;
                });
            };

            const applyScaling = (data, columns, method) => {
                const newData = JSON.parse(JSON.stringify(data));
                
                columns.forEach(column => {
                    const values = data.map(row => row[column]).filter(v => typeof v === 'number');
                    
                    if (method === 'standard') {
                        const mean = values.reduce((a, b) => a + b, 0) / values.length;
                        const std = Math.sqrt(values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values.length);
                        newData.forEach(row => {
                            if (typeof row[column] === 'number') {
                                row[column + '_scaled'] = (row[column] - mean) / std;
                            }
                        });
                    } else if (method === 'minmax') {
                        const min = Math.min(...values);
                        const max = Math.max(...values);
                        newData.forEach(row => {
                            if (typeof row[column] === 'number') {
                                row[column + '_scaled'] = (row[column] - min) / (max - min);
                            }
                        });
                    } else if (method === 'robust') {
                        const sorted = [...values].sort((a, b) => a - b);
                        const q1 = sorted[Math.floor(sorted.length * 0.25)];
                        const q3 = sorted[Math.floor(sorted.length * 0.75)];
                        const median = sorted[Math.floor(sorted.length * 0.5)];
                        const iqr = q3 - q1;
                        newData.forEach(row => {
                            if (typeof row[column] === 'number') {
                                row[column + '_scaled'] = (row[column] - median) / iqr;
                            }
                        });
                    }
                });
                
                return newData;
            };

            const applyTransformation = (data, columns, method) => {
                const newData = JSON.parse(JSON.stringify(data));
                
                columns.forEach(column => {
                    newData.forEach(row => {
                        if (typeof row[column] === 'number' && row[column] > 0) {
                            if (method === 'log') {
                                row[column + '_log'] = Math.log(row[column]);
                            } else if (method === 'sqrt') {
                                row[column + '_sqrt'] = Math.sqrt(row[column]);
                            }
                        }
                    });
                });
                
                return newData;
            };

            const removeDuplicates = (data) => {
                const seen = new Set();
                return data.filter(row => {
                    const key = JSON.stringify(row);
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            };

            // Render functions for EDA tools
            const renderOverview = () => {
                const columns = getColumns();
                const columnTypes = {};
                
                columns.forEach(col => {
                    const types = new Set(data.map(row => typeof row[col]));
                    columnTypes[col] = types.has('number') ? 'Numeric' : 'Categorical';
                });

                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>📋 Dataset Overview</h4>
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Column Name</th>
                                        <th>Type</th>
                                        <th>Non-Null Count</th>
                                        <th>Null Count</th>
                                        <th>Unique Values</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {columns.map(col => {
                                        const nonNull = data.filter(row => row[col] !== null && row[col] !== undefined && row[col] !== '').length;
                                        const unique = new Set(data.map(row => row[col])).size;
                                        return (
                                            <tr key={col}>
                                                <td style={{fontWeight: '600', color: 'var(--text-primary)'}}>{col}</td>
                                                <td><span className="badge">{columnTypes[col]}</span></td>
                                                <td>{nonNull}</td>
                                                <td>{data.length - nonNull}</td>
                                                <td>{unique}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <DataPreview data={data} />
                    </div>
                );
            };

            const renderStatistics = () => {
                const numericCols = getNumericColumns();
                const stats = {};

                numericCols.forEach(col => {
                    const values = data.map(row => row[col]).filter(v => typeof v === 'number');
                    const mean = values.reduce((a, b) => a + b, 0) / values.length;
                    const sorted = [...values].sort((a, b) => a - b);
                    
                    stats[col] = {
                        mean: mean.toFixed(2),
                        median: sorted[Math.floor(sorted.length / 2)].toFixed(2),
                        min: Math.min(...values).toFixed(2),
                        max: Math.max(...values).toFixed(2),
                        std: Math.sqrt(values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values.length).toFixed(2)
                    };
                });

                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>📈 Statistical Summary</h4>
                        <div className="stats-grid">
                            {Object.entries(stats).map(([col, stat]) => (
                                <div key={col} className="stat-card">
                                    <h5>{col}</h5>
                                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem', marginTop: '1rem'}}>
                                        <div>
                                            <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>Mean</div>
                                            <div style={{fontWeight: '600', fontFamily: 'JetBrains Mono'}}>{stat.mean}</div>
                                        </div>
                                        <div>
                                            <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>Median</div>
                                            <div style={{fontWeight: '600', fontFamily: 'JetBrains Mono'}}>{stat.median}</div>
                                        </div>
                                        <div>
                                            <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>Std Dev</div>
                                            <div style={{fontWeight: '600', fontFamily: 'JetBrains Mono'}}>{stat.std}</div>
                                        </div>
                                        <div>
                                            <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>Range</div>
                                            <div style={{fontWeight: '600', fontFamily: 'JetBrains Mono'}}>{stat.min} - {stat.max}</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const renderMissingAnalysis = () => {
                const columns = getColumns();
                const missingData = columns.map(col => {
                    const missing = data.filter(row => row[col] === null || row[col] === undefined || row[col] === '').length;
                    return {
                        column: col,
                        missing,
                        percentage: ((missing / data.length) * 100).toFixed(2)
                    };
                }).filter(item => item.missing > 0);

                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>🔍 Missing Values Analysis</h4>
                        {missingData.length > 0 ? (
                            <div className="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Column</th>
                                            <th>Missing Count</th>
                                            <th>Percentage</th>
                                            <th>Visualization</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {missingData.map(item => (
                                            <tr key={item.column}>
                                                <td style={{fontWeight: '600', color: 'var(--text-primary)'}}>{item.column}</td>
                                                <td>{item.missing}</td>
                                                <td>{item.percentage}%</td>
                                                <td>
                                                    <div style={{
                                                        background: 'var(--bg-dark)',
                                                        height: '20px',
                                                        borderRadius: '4px',
                                                        overflow: 'hidden'
                                                    }}>
                                                        <div style={{
                                                            background: 'linear-gradient(90deg, var(--warning), var(--error))',
                                                            height: '100%',
                                                            width: item.percentage + '%',
                                                            transition: 'width 0.5s ease'
                                                        }}></div>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <div className="alert alert-success">
                                ✓ No missing values detected in the dataset!
                            </div>
                        )}
                    </div>
                );
            };

            const renderCorrelation = () => {
                const numericCols = getNumericColumns();
                
                if (numericCols.length < 2) {
                    return (
                        <div className="alert alert-warning">
                            ⚠️ Need at least 2 numeric columns for correlation analysis
                        </div>
                    );
                }

                const correlations = {};
                numericCols.forEach((col1, i) => {
                    correlations[col1] = {};
                    numericCols.forEach((col2, j) => {
                        const values1 = data.map(row => row[col1]).filter(v => typeof v === 'number');
                        const values2 = data.map(row => row[col2]).filter(v => typeof v === 'number');
                        correlations[col1][col2] = calculateCorrelation(values1, values2);
                    });
                });

                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>🔗 Correlation Matrix</h4>
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th></th>
                                        {numericCols.map(col => <th key={col}>{col}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {numericCols.map(col1 => (
                                        <tr key={col1}>
                                            <th>{col1}</th>
                                            {numericCols.map(col2 => {
                                                const corr = correlations[col1][col2];
                                                const absCorr = Math.abs(corr);
                                                const color = corr > 0 ? `rgba(16, 185, 129, ${absCorr})` : `rgba(239, 68, 68, ${absCorr})`;
                                                return (
                                                    <td key={col2} style={{
                                                        background: color,
                                                        fontWeight: '600',
                                                        fontFamily: 'JetBrains Mono'
                                                    }}>
                                                        {corr.toFixed(2)}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const calculateCorrelation = (x, y) => {
                const n = Math.min(x.length, y.length);
                const meanX = x.reduce((a, b) => a + b, 0) / n;
                const meanY = y.reduce((a, b) => a + b, 0) / n;
                
                let num = 0, denX = 0, denY = 0;
                for (let i = 0; i < n; i++) {
                    const dx = x[i] - meanX;
                    const dy = y[i] - meanY;
                    num += dx * dy;
                    denX += dx * dx;
                    denY += dy * dy;
                }
                
                return num / Math.sqrt(denX * denY) || 0;
            };

            const renderDistribution = () => {
                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>📊 Distribution Analysis</h4>
                        <div className="form-group">
                            <label>Select Column</label>
                            <select value={config.column || ''} onChange={e => setConfig({...config, column: e.target.value})}>
                                <option value="">Choose a column...</option>
                                {getNumericColumns().map(col => (
                                    <option key={col} value={col}>{col}</option>
                                ))}
                            </select>
                        </div>
                        {config.column && renderHistogram(config.column)}
                    </div>
                );
            };

            const renderHistogram = (column) => {
                const values = data.map(row => row[column]).filter(v => typeof v === 'number');
                const min = Math.min(...values);
                const max = Math.max(...values);
                const bins = 10;
                const binSize = (max - min) / bins;
                const histogram = Array(bins).fill(0);
                
                values.forEach(val => {
                    const binIndex = Math.min(Math.floor((val - min) / binSize), bins - 1);
                    histogram[binIndex]++;
                });

                const maxCount = Math.max(...histogram);

                return (
                    <div className="chart-container">
                        <div style={{display: 'flex', alignItems: 'flex-end', gap: '4px', height: '200px'}}>
                            {histogram.map((count, i) => (
                                <div key={i} style={{
                                    flex: 1,
                                    background: 'linear-gradient(180deg, var(--primary), var(--primary-dark))',
                                    height: `${(count / maxCount) * 100}%`,
                                    borderRadius: '4px 4px 0 0',
                                    transition: 'height 0.5s ease',
                                    position: 'relative'
                                }}>
                                    <div style={{
                                        position: 'absolute',
                                        top: '-20px',
                                        left: '50%',
                                        transform: 'translateX(-50%)',
                                        fontSize: '0.8rem',
                                        color: 'var(--text-secondary)',
                                        fontFamily: 'JetBrains Mono'
                                    }}>{count}</div>
                                </div>
                            ))}
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between', marginTop: '0.5rem', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                            <span>{min.toFixed(2)}</span>
                            <span>{max.toFixed(2)}</span>
                        </div>
                    </div>
                );
            };

            const renderOutliers = () => {
                const numericCols = getNumericColumns();
                const outlierInfo = numericCols.map(col => {
                    const values = data.map(row => row[col]).filter(v => typeof v === 'number');
                    const sorted = [...values].sort((a, b) => a - b);
                    const q1 = sorted[Math.floor(sorted.length * 0.25)];
                    const q3 = sorted[Math.floor(sorted.length * 0.75)];
                    const iqr = q3 - q1;
                    const lowerBound = q1 - 1.5 * iqr;
                    const upperBound = q3 + 1.5 * iqr;
                    const outliers = values.filter(v => v < lowerBound || v > upperBound);
                    
                    return {
                        column: col,
                        count: outliers.length,
                        percentage: ((outliers.length / values.length) * 100).toFixed(2),
                        lowerBound: lowerBound.toFixed(2),
                        upperBound: upperBound.toFixed(2)
                    };
                }).filter(item => item.count > 0);

                return (
                    <div>
                        <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>🎯 Outlier Detection (IQR Method)</h4>
                        {outlierInfo.length > 0 ? (
                            <div className="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Column</th>
                                            <th>Outliers</th>
                                            <th>Percentage</th>
                                            <th>Lower Bound</th>
                                            <th>Upper Bound</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {outlierInfo.map(item => (
                                            <tr key={item.column}>
                                                <td style={{fontWeight: '600', color: 'var(--text-primary)'}}>{item.column}</td>
                                                <td>{item.count}</td>
                                                <td>{item.percentage}%</td>
                                                <td style={{fontFamily: 'JetBrains Mono'}}>{item.lowerBound}</td>
                                                <td style={{fontFamily: 'JetBrains Mono'}}>{item.upperBound}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <div className="alert alert-success">
                                ✓ No outliers detected using IQR method
                            </div>
                        )}
                    </div>
                );
            };

            // Render configuration panels
            const renderConfig = () => {
                const toolName = toolsConfig[category]?.tools.find(t => t.id === tool)?.name || tool;

                if (['overview', 'statistics', 'missing', 'correlation', 'distribution', 'outliers'].includes(tool)) {
                    return null; // These are view-only tools
                }

                return (
                    <div className="config-panel">
                        <h4>⚙️ Configure {toolName}</h4>
                        
                        {['mean', 'median', 'mode', 'constant', 'ffill', 'bfill'].includes(tool) && (
                            <>
                                <div className="form-group">
                                    <label>Select Column</label>
                                    <select value={config.column || ''} onChange={e => setConfig({...config, column: e.target.value})}>
                                        <option value="">Choose a column...</option>
                                        {getColumns().map(col => (
                                            <option key={col} value={col}>{col}</option>
                                        ))}
                                    </select>
                                </div>
                                {tool === 'constant' && (
                                    <div className="form-group">
                                        <label>Fill Value</label>
                                        <input 
                                            type="text" 
                                            value={config.value || ''} 
                                            onChange={e => setConfig({...config, value: e.target.value})}
                                            placeholder="Enter constant value"
                                        />
                                    </div>
                                )}
                            </>
                        )}

                        {['label', 'onehot', 'ordinal', 'target', 'binary', 'frequency'].includes(tool) && (
                            <div className="form-group">
                                <label>Select Categorical Column</label>
                                <select value={config.column || ''} onChange={e => setConfig({...config, column: e.target.value})}>
                                    <option value="">Choose a column...</option>
                                    {getCategoricalColumns().map(col => (
                                        <option key={col} value={col}>{col}</option>
                                    ))}
                                </select>
                            </div>
                        )}

                        {['standard', 'minmax', 'robust', 'maxabs', 'normalizer'].includes(tool) && (
                            <div className="form-group">
                                <label>Select Columns to Scale</label>
                                <div className="checkbox-group">
                                    {getNumericColumns().map(col => (
                                        <label key={col} className="checkbox-label">
                                            <input 
                                                type="checkbox"
                                                checked={(config.columns || []).includes(col)}
                                                onChange={e => {
                                                    const cols = config.columns || [];
                                                    setConfig({
                                                        ...config,
                                                        columns: e.target.checked 
                                                            ? [...cols, col]
                                                            : cols.filter(c => c !== col)
                                                    });
                                                }}
                                            />
                                            {col}
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        {['log', 'sqrt', 'power', 'boxcox', 'yeojohnson'].includes(tool) && (
                            <div className="form-group">
                                <label>Select Columns to Transform</label>
                                <div className="checkbox-group">
                                    {getNumericColumns().map(col => (
                                        <label key={col} className="checkbox-label">
                                            <input 
                                                type="checkbox"
                                                checked={(config.columns || []).includes(col)}
                                                onChange={e => {
                                                    const cols = config.columns || [];
                                                    setConfig({
                                                        ...config,
                                                        columns: e.target.checked 
                                                            ? [...cols, col]
                                                            : cols.filter(c => c !== col)
                                                    });
                                                }}
                                            />
                                            {col}
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="action-buttons">
                            <button className="btn" onClick={applyTool}>
                                ✨ Apply Transformation
                            </button>
                        </div>

                        {result && (
                            <div className={`alert alert-${result.type}`}>
                                {result.message}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div>
                    {renderConfig()}
                    {['overview', 'statistics', 'missing', 'correlation', 'distribution', 'outliers'].includes(tool) && applyTool()}
                    <DataPreview data={data} />
                </div>
            );
        }

        function AIAgent({ isOpen, onClose, data, onApplyTool }) {
            const [messages, setMessages] = useState([{
                role: 'ai',
                content: 'Hello! I\'m your AI preprocessing assistant. I can help you:\n\n• Analyze your dataset and identify issues\n• Suggest appropriate preprocessing steps\n• Explain different techniques\n• Recommend a complete preprocessing pipeline\n\nWhat would you like help with?',
                suggestions: [
                    'Analyze my dataset',
                    'What preprocessing do I need?',
                    'Handle missing values',
                    'Suggest feature engineering'
                ]
            }]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const analyzeDataset = () => {
                if (!data || data.length === 0) return 'No data available';

                const columns = Object.keys(data[0] || {});
                const numRows = data.length;
                
                const analysis = {
                    rows: numRows,
                    columns: columns.length,
                    columnDetails: []
                };

                columns.forEach(col => {
                    const values = data.map(row => row[col]);
                    const nonNull = values.filter(v => v !== null && v !== undefined && v !== '');
                    const missing = values.length - nonNull.length;
                    const unique = new Set(values).size;
                    const isNumeric = nonNull.some(v => typeof v === 'number');
                    
                    let stats = {};
                    if (isNumeric) {
                        const nums = nonNull.filter(v => typeof v === 'number');
                        const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
                        stats = {
                            mean: mean.toFixed(2),
                            min: Math.min(...nums).toFixed(2),
                            max: Math.max(...nums).toFixed(2)
                        };
                    }

                    analysis.columnDetails.push({
                        name: col,
                        type: isNumeric ? 'numeric' : 'categorical',
                        missing,
                        missingPct: ((missing / values.length) * 100).toFixed(1),
                        unique,
                        ...stats
                    });
                });

                return JSON.stringify(analysis, null, 2);
            };

            const sendMessage = async (messageText) => {
                if (!messageText.trim() || loading) return;

                const userMessage = { role: 'user', content: messageText };
                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setLoading(true);

                try {
                    const datasetContext = analyzeDataset();
                    
                    const systemPrompt = `You are an expert data preprocessing assistant. You help users understand and apply data preprocessing techniques.

Available preprocessing tools:
1. EDA: Overview, Statistics, Missing Values Analysis, Correlation, Distribution, Outliers
2. Imputation: Mean, Median, Mode, Constant, Forward Fill, Backward Fill, KNN, Iterative
3. Encoding: Label, One-Hot, Ordinal, Target, Binary, Frequency
4. Scaling: Standard, MinMax, Robust, MaxAbs, Normalizer
5. Transformation: Log, Square Root, Power, Box-Cox, Yeo-Johnson
6. Feature Creation: Polynomial, Interaction, Binning, DateTime, Aggregation
7. Feature Selection: Variance Threshold, Correlation Filter, Univariate, RFE
8. Cleaning: Remove Duplicates, Handle Outliers, Type Conversion, Rename, Filter Rows

Current dataset analysis:
${datasetContext}

Provide specific, actionable recommendations. Be concise but thorough. When suggesting specific tools, mention them by name from the available tools list above.`;

                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            system: systemPrompt,
                            messages: [
                                ...messages.filter(m => m.role !== 'ai' || !m.suggestions).map(m => ({
                                    role: m.role === 'ai' ? 'assistant' : 'user',
                                    content: m.content
                                })),
                                { role: 'user', content: messageText }
                            ]
                        })
                    });

                    const result = await response.json();
                    const aiResponse = result.content.find(c => c.type === 'text')?.text || 'Sorry, I encountered an error.';

                    // Extract tool suggestions from the response
                    const suggestions = [];
                    if (aiResponse.toLowerCase().includes('missing') || aiResponse.toLowerCase().includes('imputation')) {
                        suggestions.push('Show imputation options');
                    }
                    if (aiResponse.toLowerCase().includes('scaling') || aiResponse.toLowerCase().includes('normalization')) {
                        suggestions.push('Show scaling methods');
                    }
                    if (aiResponse.toLowerCase().includes('encoding') || aiResponse.toLowerCase().includes('categorical')) {
                        suggestions.push('Show encoding options');
                    }

                    setMessages(prev => [...prev, { 
                        role: 'ai', 
                        content: aiResponse,
                        suggestions: suggestions.length > 0 ? suggestions : ['Tell me more', 'Next steps?']
                    }]);
                } catch (error) {
                    console.error('AI Error:', error);
                    setMessages(prev => [...prev, { 
                        role: 'ai', 
                        content: 'I apologize, but I encountered an error. Please try again or ask a different question.'
                    }]);
                }

                setLoading(false);
            };

            const handleSuggestionClick = (suggestion) => {
                if (suggestion.includes('imputation') || suggestion.includes('Imputation')) {
                    onApplyTool('imputation', 'mean');
                } else if (suggestion.includes('scaling') || suggestion.includes('Scaling')) {
                    onApplyTool('scaling', 'standard');
                } else if (suggestion.includes('encoding') || suggestion.includes('Encoding')) {
                    onApplyTool('encoding', 'label');
                } else {
                    sendMessage(suggestion);
                }
            };

            return (
                <div className={`ai-chat-panel ${isOpen ? 'open' : ''}`}>
                    <div className="ai-chat-header">
                        <h3>🤖 AI Assistant</h3>
                        <button className="close-chat" onClick={onClose}>×</button>
                    </div>

                    <div className="ai-chat-messages">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`message ${msg.role}`}>
                                <div className="message-avatar">
                                    {msg.role === 'user' ? '👤' : '🤖'}
                                </div>
                                <div className="message-content">
                                    {msg.content.split('\n').map((line, i) => (
                                        <div key={i}>{line || <br />}</div>
                                    ))}
                                    {msg.suggestions && (
                                        <div className="suggestion-chips">
                                            {msg.suggestions.map((suggestion, i) => (
                                                <div 
                                                    key={i} 
                                                    className="suggestion-chip"
                                                    onClick={() => handleSuggestionClick(suggestion)}
                                                >
                                                    {suggestion}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="message ai">
                                <div className="message-avatar">🤖</div>
                                <div className="message-content">
                                    <div className="typing-indicator">
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="ai-chat-input">
                        <textarea
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyPress={(e) => {
                                if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault();
                                    sendMessage(input);
                                }
                            }}
                            placeholder="Ask about preprocessing techniques..."
                            disabled={loading}
                        />
                        <button 
                            className="send-button" 
                            onClick={() => sendMessage(input)}
                            disabled={loading || !input.trim()}
                        >
                            ➤
                        </button>
                    </div>
                </div>
            );
        }

        function DataPreview({ data }) {
            const [page, setPage] = useState(0);
            const rowsPerPage = 10;
            const totalPages = Math.ceil(data.length / rowsPerPage);
            const displayData = data.slice(page * rowsPerPage, (page + 1) * rowsPerPage);
            const columns = Object.keys(data[0] || {});

            return (
                <div style={{marginTop: '2rem'}}>
                    <h4 style={{marginBottom: '1rem', color: 'var(--primary)'}}>📄 Data Preview</h4>
                    <div className="table-container" style={{maxHeight: '400px', overflow: 'auto'}}>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    {columns.map(col => <th key={col}>{col}</th>)}
                                </tr>
                            </thead>
                            <tbody>
                                {displayData.map((row, idx) => (
                                    <tr key={idx}>
                                        <td style={{fontWeight: '600', color: 'var(--primary)'}}>{page * rowsPerPage + idx + 1}</td>
                                        {columns.map(col => (
                                            <td key={col}>
                                                {row[col] === null || row[col] === undefined || row[col] === '' 
                                                    ? <span style={{color: 'var(--error)', fontStyle: 'italic'}}>null</span>
                                                    : String(row[col])}
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div style={{display: 'flex', justifyContent: 'center', gap: '1rem', marginTop: '1rem', alignItems: 'center'}}>
                        <button 
                            className="btn btn-secondary" 
                            onClick={() => setPage(Math.max(0, page - 1))}
                            disabled={page === 0}
                        >
                            ← Previous
                        </button>
                        <span style={{color: 'var(--text-secondary)'}}>
                            Page {page + 1} of {totalPages}
                        </span>
                        <button 
                            className="btn btn-secondary" 
                            onClick={() => setPage(Math.min(totalPages - 1, page + 1))}
                            disabled={page === totalPages - 1}
                        >
                            Next →
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DataPreprocessingToolkit />, document.getElementById('root'));
    </script>
</body>
</html>
